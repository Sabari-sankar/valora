<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1126"/>
      <stop offset="50%" stop-color="#181a38"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background Container (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Specular Outer Rim Glow -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="rgba(99,102,241,0.4)" stroke-width="4" filter="url(#glow)"/>

  <!-- Logo Diamond Hexagon Shape -->
  <g transform="translate(256, 256) scale(12)">
    <path d="M0 -11 L10 -5 L10 5 L0 11 L-10 5 L-10 -5 Z" fill="rgba(99,102,241,0.2)" stroke="url(#iconGrad)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="4" fill="url(#emeraldGrad)"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="2 2"/>
  </g>
</svg>
